<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Admin — Submit Access Request</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1a1d21; }
  header { background: #1a2b4a; color: #fff; padding: 14px 24px; font-weight: 600; }
  main { max-width: 560px; margin: 40px auto; background: #fff; border: 1px solid #e2e5ea; border-radius: 8px; padding: 26px 28px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.6; color: #333941; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 18px 0 6px; }
  input { width: 100%; padding: 9px 11px; font-size: 14px; border: 1px solid #ccd2da; border-radius: 6px; }
  button { margin-top: 16px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
  #out { margin-top: 16px; font-size: 14px; font-weight: 600; min-height: 22px; }
  .ok { color: #1a7f37; } .bad { color: #b3261e; }
</style>
</head>
<body>
<header>Acme Admin Console</header>
<main>
  <h1>Submit access request</h1>
  <p>Enter the workspace you need access to and submit. You will receive a
  confirmation once the request reaches the security queue.</p>

  <label for="ws">Workspace name</label>
  <input id="ws" placeholder="e.g. production-west">
  <button id="go" onclick="go()">Submit request</button>
  <div id="out"></div>
</main>
<script>
  var attempts=0;
  function go(){
    var v=document.getElementById('ws').value.trim();
    var o=document.getElementById('out');
    if(!v){ o.className='bad'; o.textContent='Enter a workspace name.'; return; }
    attempts++;
    if(attempts<3){
      o.className='bad';
      o.textContent='Submission failed — the request service did not respond. Please try again.';
    } else {
      o.className='ok';
      o.textContent='Request submitted. Security will review it shortly.';
    }
  }
</script>
</body>
</html>
